<!--
element.textContents -> cały tekst zawarty w elemencie i wszystkie jego elementy podrzędne, które służą do formatowania

element.innerText -> zwraca cały tekst zawarty w elemencie i wszystkie jego elementy potomne

element.innerHTML -> zwraca cały tekst, w tym znaczniki HTML, który jest zawarty w elemencie

element.attribute -> nowa wartość zmienia wartość atrybutu elementu HTML

element.stlye.property -> nowy styl zmienia styl elementu HTML

element.createElement -> tworzy element

element.removeChild -> usuwa element

element.appendChild -> dodaje element

element.replaceChild -> zamienia element
-->
